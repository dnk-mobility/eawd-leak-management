<!DOCTYPE html>

<link rel="stylesheet" href="styles.css">
<style>
  /*
    전체 현황(대시보드) — 6개 채널을 한 화면에서 요약해서 보여주고, 카드를 누르면
    그 채널의 상세 화면(index.html?eq=..)으로 이동한다.

    설계 배경 (2026-09-21):
    - 기존 index.html은 "QR 하나 = 채널 하나"를 전제로 한 단일 채널 화면이라,
      6개 채널을 한 화면에서 훑어보려면 QR을 6번 찍어야 했다. 관리자가 "오늘 어디가
      문제인지" 보려면 불편하다는 지적을 받아 이 화면을 새로 만들었다.
    - index.html에 "채널 없음" 모드를 끼워 넣는 대신 완전히 별도 파일로 뒀다 —
      index.html은 2900줄 넘게 단일 채널(eqId) 전제로 짜여 있어, 그 안에 분기를
      추가하면 현장 작업자가 매일 쓰는 핵심 흐름(QR→즉시 입력)을 건드릴 위험이 있다.
      새 화면 하나를 따로 만드는 편이 기존 화면을 훨씬 덜 건드린다.
    - 접근 권한은 다른 채널 화면과 동일한 1차 접속 암호 하나로 통일한다(요청) —
      사내 직원 전체가 대시보드·채널 상세 모두 같은 암호로 볼 수 있다. 보정이력
      입력·잠금만 기존처럼 별도 관리자 암호가 필요하다(이 화면은 손대지 않음).
    - EQ/judge()/detectTrend() 등은 index.html에도 같은 로직이 있다 — 이 파일
      스코프에서는 그 함수에 접근할 수 없어(별도 <script>) 여기 똑같이 하나 더
      둔다(gate.js가 sha256Hex를 index.html에 넘겨주는 것과 다르게, 이건 앱 로직이라
      넘겨줄 마땅한 자리가 없다). **판정 기준(judge)이나 이상탐지 규칙(detectTrend)을
      고치면 index.html과 이 파일 양쪽을 다 고쳐야 한다** — 벗어나면 대시보드와
      상세 화면의 판정이 서로 달라지는 조용한 버그가 된다.
  */
  body{margin:0;background:var(--white);}
  .d-hero{
    background:linear-gradient(135deg,#173f3e 0%,#1b4a49 45%,#2f6e6c 100%);
    padding:22px 16px 28px;color:#fff;position:relative;overflow:hidden;
  }
  .d-hero::before{
    content:"";position:absolute;top:-60px;right:-40px;width:200px;height:200px;
    border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 70%);
  }
  .d-hero::after{
    content:"";position:absolute;bottom:-70px;left:-40px;width:180px;height:180px;
    border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.06) 0%,rgba(255,255,255,0) 70%);
  }
  .d-hero-inner{position:relative;max-width:640px;margin:0 auto;}
  .d-hero .brand{font-size:11px;font-weight:700;color:#bfe0dc;letter-spacing:.07em;}
  .d-hero .title{font-size:21px;font-weight:800;margin-top:4px;letter-spacing:-.01em;}
  .d-hero .meta{font-size:12px;color:#cfe6e2;margin-top:4px;}

  .stat-strip{
    display:flex;gap:8px;max-width:640px;margin:-16px auto 0;padding:0 16px;position:relative;z-index:3;
  }
  .stat-chip{
    flex:1;background:var(--white);border-radius:13px;padding:10px 6px 9px;text-align:center;
    box-shadow:0 6px 16px rgba(43,38,33,.12);border:1px solid var(--line);
  }
  .stat-chip .n{font-size:19px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;}
  .stat-chip .l{font-size:9.5px;color:var(--gray-500);font-weight:700;margin-top:3px;letter-spacing:.02em;}
  .stat-chip.ok .n{color:var(--ok-text);}
  .stat-chip.ng .n{color:#8a3226;}
  .stat-chip.wait .n{color:var(--gray-700);}

  .d-list{max-width:640px;margin:0 auto;padding:16px 16px 40px;}
  .d-note{font-size:11.5px;color:var(--warn-text);background:var(--warn-bg);border-radius:8px;padding:9px 11px;margin-bottom:12px;}

  .d-card{
    position:relative;overflow:hidden;display:block;text-decoration:none;color:inherit;
    background:var(--white);border:1px solid var(--line);border-radius:12px;
    padding:13px 13px 11px 17px;margin:0 0 11px;box-shadow:0 3px 10px rgba(43,38,33,.06);
    cursor:pointer;
  }
  .d-card:active{background:#faf6ee;}
  .d-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gray-300);}
  .d-card.ok::before{background:#4a8f3e;}
  .d-card.ng::before{background:#b8453a;}
  .d-card.wait::before{background:var(--gray-400);}
  .d-row1{display:flex;align-items:center;gap:8px;}
  .d-badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;flex-shrink:0;}
  .d-badge.ok{background:var(--ok-bg);color:var(--ok-text);}
  .d-badge.ng{background:#f6ddd8;color:#8a3226;}
  .d-badge.wait{background:var(--gray-200);color:var(--gray-700);}
  .d-badge.ng .txt{animation:dBadgePulse 1.3s ease-in-out infinite;}
  @keyframes dBadgePulse{0%,100%{opacity:1;}50%{opacity:.45;}}
  @media (prefers-reduced-motion:reduce){ .d-badge.ng .txt{animation:none;} }
  .d-name{font-size:13.5px;font-weight:800;color:var(--gray-900);}
  .d-no{font-size:10.5px;color:var(--gray-400);}
  .d-chev{margin-left:auto;color:var(--gray-400);font-size:15px;}
  .d-spark{width:100%;height:46px;margin-top:9px;display:block;}
  .d-foot{font-size:11px;color:var(--gray-700);margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .d-flag{font-size:10px;font-weight:800;color:var(--warn-text);background:var(--warn-bg);padding:1px 6px;border-radius:5px;}
  .d-empty{font-size:11px;color:var(--gray-400);margin-top:9px;padding:10px 0;text-align:center;}

  .d-back{
    display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--navy);
    text-decoration:none;padding:8px 4px;
  }

  footer{max-width:640px;margin:0 auto;padding:12px 16px 32px;text-align:center;color:var(--gray-500);font-size:11px;line-height:1.6;}

  /* 도움말 위젯 — index.html과 동일(§4-6 참고). 이 파일은 채널 하나로 좁혀진
     화면이 아니라 6개 채널 요약이라, "OK 마스터 트렌드 분석해줘" 같은 실시간
     분석 기능(matchLiveAnalysis)은 특정 채널 문맥이 없어 옮기지 않았다 —
     FAQ 검색만 그대로 제공한다. */
  #helpWrap{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:300;}
  #helpFab{
    width:52px;height:52px;border-radius:50%;border:none;background:var(--navy);color:#fff;
    font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(27,74,73,.35);
    display:flex;align-items:center;justify-content:center;
  }
  #helpFab:active{opacity:.85;}
  #helpFab{animation:helpFabPulse 1.7s ease-in-out infinite;}
  #helpFab[aria-expanded="true"]{animation:none;box-shadow:0 4px 14px rgba(27,74,73,.35);}
  @keyframes helpFabPulse{
    0%,100%{box-shadow:0 4px 14px rgba(27,74,73,.35);}
    50%{box-shadow:0 4px 22px rgba(168,117,47,.8),0 0 0 7px rgba(168,117,47,.16);}
  }
  #helpFabIcon{display:inline-block;animation:helpPulse 1.7s ease-in-out infinite;}
  #helpFab[aria-expanded="true"] #helpFabIcon{animation:none;opacity:1;filter:none;}
  @keyframes helpPulse{
    0%,100%{opacity:1;filter:drop-shadow(0 0 0 rgba(168,117,47,0));}
    50%{opacity:.5;filter:drop-shadow(0 0 6px rgba(168,117,47,.9));}
  }
  @media (prefers-reduced-motion:reduce){ #helpFab,#helpFabIcon{animation:none;} }
  #helpPanel{
    position:absolute;right:0;bottom:62px;width:min(340px,calc(100vw - 32px));
    max-height:min(70vh,520px);background:var(--white);border-radius:12px;
    box-shadow:0 8px 28px rgba(43,38,33,.22);border:1px solid var(--gray-300);
    display:flex;flex-direction:column;overflow:hidden;
  }
  #helpPanel[hidden]{display:none;}
  #helpPanel.kb-avoid{
    position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:16px;bottom:auto;
    width:min(340px,calc(100vw - 32px));
  }
  .help-head{
    display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--navy);color:#fff;
    font-size:13px;font-weight:800;
  }
  .help-head span{flex:1;}
  .help-head button{
    border:none;background:rgba(255,255,255,.16);color:#fff;width:26px;height:26px;
    border-radius:6px;font-size:13px;line-height:1;cursor:pointer;flex-shrink:0;
  }
  .help-search-row{padding:10px 12px;border-bottom:1px solid var(--gray-200);}
  .help-search-row input{
    width:100%;box-sizing:border-box;font-family:inherit;font-size:14px;
    padding:8px 10px;border:1px solid var(--gray-300);border-radius:7px;background:var(--gray-100);
  }
  .help-list{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 0;}
  .help-empty{padding:20px 14px;text-align:center;color:var(--gray-500);font-size:12.5px;}
  .help-fuzzy-note{padding:10px 14px 4px;color:var(--gray-500);font-size:11.5px;}
  .help-item{border-bottom:1px solid var(--gray-100);}
  .help-q{
    width:100%;text-align:left;border:none;background:none;cursor:pointer;
    padding:10px 14px;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--gray-900);
    display:flex;align-items:center;gap:6px;
  }
  .help-q .tag{
    flex-shrink:0;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:4px;
    background:var(--gray-200);color:var(--gray-700);
  }
  .help-q .tag.admin{background:var(--warn-bg);color:var(--warn-text);}
  .help-q .chev{margin-left:auto;color:var(--gray-400);flex-shrink:0;}
  .help-a{padding:0 14px 12px 14px;font-size:12px;color:var(--gray-700);line-height:1.55;}
  .goto{
    display:inline-block;margin-top:8px;border:none;background:var(--accent);color:#fff;
    font-family:inherit;font-size:11.5px;font-weight:700;padding:7px 12px;border-radius:6px;cursor:pointer;
  }
</style>
</head>

<script>
(function () {
  "use strict";

  /* =========================================================================
     index.html과 중복되는 부분 — 위 파일 상단 주석 참고
     ========================================================================= */
  var EQ = {
    "120":   { tab: "조립전 유로계",         title: "조립전 유로계 리크검사기" },
    "130-h": { tab: "조립전 전체계(하우징)", title: "조립전 전체계 리크검사기 — 하우징" },
    "130-i": { tab: "조립전 전체계(인버터)", title: "조립전 전체계 리크검사기 — 인버터" },
    "180":   { tab: "조립후 유로계",         title: "조립후 유로계 리크검사기" },
    "190-h": { tab: "조립후 전체계(하우징)", title: "조립후 전체계 리크검사기 — 하우징" },
    "190-i": { tab: "조립후 전체계(인버터)", title: "조립후 전체계 리크검사기 — 인버터" }
  };
  var EQ_IDS = ["120", "130-h", "130-i", "180", "190-h", "190-i"];
  var STORE_KEY = "dnk_leak_master_v1";

  function $(id) { return document.getElementById(id); }
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }
  function curYm() { return todayStr().slice(0, 7); }
  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function judge(v, lsl, usl) {
    if (v === null) return "-";
    if (lsl === null && usl === null) return "-";
    if (lsl !== null && v < lsl) return "NG";
    if (usl !== null && v > usl) return "NG";
    return "OK";
  }
  function mean(arr) { return arr.reduce(function (a, b) { return a + b; }, 0) / arr.length; }
  function stdev(arr, m) {
    if (arr.length < 2) return 0;
    var mm = m === undefined ? mean(arr) : m;
    var sq = arr.reduce(function (a, b) { return a + (b - mm) * (b - mm); }, 0);
    return Math.sqrt(sq / (arr.length - 1));
  }
  var TREND_EPS = 1e-9;
  // index.html의 detectTrend()에서 "이유 설명 문장"만 뺀 축소판 — 대시보드는
  // 이상 신호가 있는지 없는지(⚠ 표시)만 필요하고, 근거 문장은 상세 화면에서 본다.
  function hasAnomaly(vals) {
    var n = vals.length;
    if (n < 6) return false;
    var m = mean(vals);

    // [1] 연속 추세 — 최근 값이 6회 연속 계속 커지거나 계속 작아짐
    var trendRun = 1, trendDir = 0, trendHit = false;
    for (var i = n - 1; i > 0; i--) {
      var d1 = vals[i] > vals[i - 1] ? 1 : vals[i] < vals[i - 1] ? -1 : 0;
      if (i === n - 1) { trendDir = d1; if (!d1) break; trendRun = 2; continue; }
      if (d1 === trendDir) trendRun++; else break;
    }
    if (trendDir && trendRun >= 6) trendHit = true;
    if (trendHit) return true;

    // [2] 평균 한쪽 쏠림 — 최근 값이 8회 연속 평균의 한쪽에만 있음
    var sideRun = 1, side = 0, sideHit = false;
    for (var j = n - 1; j >= 0; j--) {
      var d2 = vals[j] > m + TREND_EPS ? 1 : vals[j] < m - TREND_EPS ? -1 : 0;
      if (j === n - 1) { side = d2; if (!d2) break; continue; }
      if (d2 === side) sideRun++; else break;
    }
    if (side && sideRun >= 8) sideHit = true;
    if (sideHit) return true;

    // [3] 변동성 급증 — 최근 5회의 표준편차가 그 이전 구간의 1.8배 초과
    if (n >= 10) {
      var recent = vals.slice(-5), base = vals.slice(0, -5);
      var sdRecent = stdev(recent), sdBase = stdev(base);
      if (sdBase > TREND_EPS && sdRecent > sdBase * 1.8) return true;
    }
    return false;
  }

  /* =========================================================================
     데이터 준비 — 이 폰의 로컬 캐시를 먼저 쓰고, 연동이 켜져 있으면 최신값으로 덮는다
     ========================================================================= */
  function loadLocal() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      var db = raw ? JSON.parse(raw) : null;
      if (!db || !db.eq) db = { v: 1, eq: {} };
      EQ_IDS.forEach(function (id) {
        if (!db.eq[id]) db.eq[id] = { samples: [], recs: [] };
      });
      return db;
    } catch (e) {
      var empty = { v: 1, eq: {} };
      EQ_IDS.forEach(function (id) { empty.eq[id] = { samples: [], recs: [] }; });
      return empty;
    }
  }

  function channelStats(e) {
    var ym = curYm(), today = todayStr();
    var monthRecs = e.recs.filter(function (r) { return r.date.slice(0, 7) === ym; });
    var todayRecs = monthRecs.filter(function (r) { return r.date === today; });

    var ngCount = 0;
    monthRecs.forEach(function (r) { r.items.forEach(function (it) { if (it.judge === "NG") ngCount++; }); });

    var todayStatus = "wait";
    if (todayRecs.length) {
      var anyNg = todayRecs.some(function (r) { return r.items.some(function (it) { return it.judge === "NG"; }); });
      todayStatus = anyNg ? "ng" : "ok";
    }

    // 미니 그래프·이상신호는 대표로 첫 샘플 하나만 쓴다(카드 하나에 여러 샘플을
    // 다 넣으면 좁은 화면에서 복잡해진다 — 나머지는 상세 화면에서 확인).
    var s0 = e.samples && e.samples[0];
    var pts = [];
    if (s0) {
      monthRecs.slice().sort(function (a, b) {
        return a.date === b.date ? (a.shift === b.shift ? 0 : a.shift === "야간" ? 1 : -1) : (a.date < b.date ? -1 : 1);
      }).forEach(function (r) {
        r.items.forEach(function (it) { if (it.sid === s0.id && it.v !== null) pts.push(it.v); });
      });
    }
    var anomaly = hasAnomaly(pts);

    return {
      todayStatus: todayStatus, ngCount: ngCount, recordCount: monthRecs.length, pts: pts,
      anomaly: anomaly, sampleName: s0 ? s0.name : "",
      spec: s0 ? { lsl: s0.lsl, usl: s0.usl } : null
    };
  }

  // 2026-09-22: 선이 굵어 보이고 축·스펙선이 없다는 지적을 받아 두 가지를 고쳤다.
  // ① 굵기 — viewBox(100x34)를 카드 실제 픽셀 크기(폭 300px대, 높이 46px)로 늘리며
  //   preserveAspectRatio="none"가 가로·세로를 서로 다른 비율로 늘린다. stroke-width는
  //   그 늘어난 좌표계 기준이라 가로 변화가 급한 구간에서 획이 특히 두꺼워 보였다.
  //   vector-effect="non-scaling-stroke"로 이 왜곡을 없애 화면 픽셀 기준 두께로 고정한다.
  // ② X·Y축 + 스펙선 — 왼쪽에 짧은 Y축, 아래에 X축을 긋고, 상/하한(usl/lsl)이
  //   등록돼 있으면 빨간 점선으로 표시한다. 카드가 작아 숫자 라벨까지는 안 넣는다
  //   (상세 화면 ②그래프에 가면 라벨 있는 전체 버전을 볼 수 있다).
  function sparkSvg(pts, status, spec) {
    if (pts.length < 2) return null;
    spec = spec || {};
    var W = 100, H = 34, PL = 3, PR = 1, top = 2, base = 30;
    var lo = Math.min.apply(null, pts), hi = Math.max.apply(null, pts);
    if (typeof spec.lsl === "number") { lo = Math.min(lo, spec.lsl); hi = Math.max(hi, spec.lsl); }
    if (typeof spec.usl === "number") { lo = Math.min(lo, spec.usl); hi = Math.max(hi, spec.usl); }
    var span = hi - lo;
    if (span === 0) { span = Math.max(Math.abs(hi) * 0.2, 1); }
    lo -= span * 0.15; hi += span * 0.15;
    function X(i) { return pts.length === 1 ? (PL + (W - PL - PR) / 2) : PL + (W - PL - PR) * (i / (pts.length - 1)); }
    function Y(v) { return top + (base - top) * (1 - (v - lo) / (hi - lo)); }
    var color = status === "ng" ? "#b8453a" : status === "wait" ? "#b3a896" : "#2f6e6c";
    // polyline points="x,y x,y .." 형식과 path d="M.. L.." 형식은 문법이 다르다
    // (구현 중 자체 발견 — 처음엔 둘을 한 변수로 같이 쓰려다 <polyline>에 속성이
    // 두 번 들어가는 잘못된 마크업이 됐다). 각자 맞는 형식으로 따로 만든다.
    var pointsAttr = pts.map(function (v, i) { return X(i).toFixed(1) + "," + Y(v).toFixed(1); }).join(" ");
    var pathLine = pts.map(function (v, i) { return X(i).toFixed(1) + "," + Y(v).toFixed(1); }).join(" L");
    var areaD = "M" + X(0).toFixed(1) + "," + base + " L" + pathLine + " L" + X(pts.length - 1).toFixed(1) + "," + base + " Z";
    var gid = "dg" + Math.random().toString(36).slice(2, 8);
    var ticks = pts.map(function (v, i) {
      var x = X(i).toFixed(1);
      return '<line x1="' + x + '" y1="' + base + '" x2="' + x + '" y2="' + (base + 2) + '" stroke="#c9bea6" stroke-width="0.6"/>';
    }).join("");
    var specLines = "";
    if (typeof spec.usl === "number") {
      var yU = Y(spec.usl).toFixed(1);
      specLines += '<line x1="' + PL + '" y1="' + yU + '" x2="' + (W - PR) + '" y2="' + yU +
        '" stroke="#b8453a" stroke-width="0.6" stroke-dasharray="2.5 2" vector-effect="non-scaling-stroke"/>';
    }
    if (typeof spec.lsl === "number") {
      var yL = Y(spec.lsl).toFixed(1);
      specLines += '<line x1="' + PL + '" y1="' + yL + '" x2="' + (W - PR) + '" y2="' + yL +
        '" stroke="#b8453a" stroke-width="0.6" stroke-dasharray="2.5 2" vector-effect="non-scaling-stroke"/>';
    }
    var last = pts.length - 1;
    return '<svg class="d-spark" viewBox="0 0 100 34" preserveAspectRatio="none">' +
      '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + color + '" stop-opacity=".2"/>' +
      '<stop offset="100%" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
      '<line x1="' + PL + '" y1="' + top + '" x2="' + PL + '" y2="' + base + '" stroke="#a89b82" stroke-width="0.6" vector-effect="non-scaling-stroke"/>' +
      '<line x1="' + PL + '" y1="' + base + '" x2="' + (W - PR) + '" y2="' + base + '" stroke="#a89b82" stroke-width="0.6" vector-effect="non-scaling-stroke"/>' +
      specLines +
      ticks +
      '<path d="' + areaD + '" fill="url(#' + gid + ')"/>' +
      '<polyline points="' + pointsAttr + '" fill="none" stroke="' + color + '" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' +
      '<circle cx="' + X(last).toFixed(1) + '" cy="' + Y(pts[last]).toFixed(1) + '" r="2.4" fill="' + color + '" stroke="#fff" stroke-width=".8" vector-effect="non-scaling-stroke"/>' +
      "</svg>";
  }

  function renderCard(id, e) {
    var st = channelStats(e);
    var badgeTxt = st.todayStatus === "ok" ? "OK" : st.todayStatus === "ng" ? "NG" : "미점검";
    var badgeHtml = st.todayStatus === "ng"
      ? '<span class="d-badge ng"><span class="txt">NG</span></span>'
      : '<span class="d-badge ' + st.todayStatus + '">' + badgeTxt + '</span>';
    var spark = sparkSvg(st.pts, st.todayStatus, st.spec);
    var flag = st.anomaly ? '<span class="d-flag">⚠ 추이 이상</span>' : "";
    var footText = st.todayStatus === "wait"
      ? "이번 달 NG " + st.ngCount + "건 · 오늘 아직 입력 없음"
      : "이번 달 NG " + st.ngCount + "건 · " + st.recordCount + "회 기록";
    // 그래프는 대표 샘플(samples[0]) 하나만 쓰지만, NG 건수·기록 횟수는 그 채널의
    // 모든 샘플을 합친 값이다 — 그래서 "이번 달 NG 1건"인데 그래프는 비어 있을 수
    // 있다(NG가 다른 샘플에서 났을 때). 이 경우 "이번 달 기록이 아직 없습니다"라고
    // 하면 바로 아래 NG 건수 문구와 모순돼 보인다(구현 중 실제 데이터로 재현해
    // 발견). 전체 기록 유무(recordCount)로 문구를 나눠 모순을 없앤다.
    var emptyMsg = st.recordCount === 0
      ? "이번 달 기록이 아직 없습니다"
      : "대표 샘플(" + esc(st.sampleName || "-") + ") 그래프를 그릴 데이터가 부족합니다";

    return '<a class="d-card ' + st.todayStatus + '" href="index.html?eq=' + encodeURIComponent(id) + '">' +
      '<div class="d-row1">' + badgeHtml +
        '<span class="d-name">' + esc(EQ[id].tab) + '</span>' +
        '<span class="d-no">' + esc(id) + '</span>' +
        '<span class="d-chev">›</span>' +
      '</div>' +
      (spark || '<div class="d-empty">' + emptyMsg + '</div>') +
      '<div class="d-foot">' + footText + (flag ? " " + flag : "") + '</div>' +
      '</a>';
  }

  function renderAll(db, offlineNote) {
    var ok = 0, ng = 0, wait = 0;
    var html = "";
    EQ_IDS.forEach(function (id) {
      var e = db.eq[id];
      var st = channelStats(e);
      if (st.todayStatus === "ok") ok++; else if (st.todayStatus === "ng") ng++; else wait++;
      html += renderCard(id, e);
    });
    $("stOk").textContent = ok;
    $("stNg").textContent = ng;
    $("stWait").textContent = wait;
    $("dList").innerHTML = (offlineNote ? '<div class="d-note">' + esc(offlineNote) + '</div>' : "") + html;
    $("dMeta").textContent = "6개 채널 · " + todayStr() + " 기준";
  }

  /* =========================================================================
     도움말 위젯 — index.html §4-6과 동일한 FAQ 검색(문서 상단 주석 참고).
     "OK 마스터 트렌드 분석해줘" 같은 실시간 분석(matchLiveAnalysis)은 특정
     채널 문맥이 있어야 하는데 이 화면은 6개 채널 요약이라 옮기지 않았다 —
     그래서 FAQ의 goto 이동 버튼도 렌더링하지 않는다(index.html의 섹션 id가
     이 페이지엔 없어 눌러도 아무 반응 없는 죽은 버튼이 되는 것을 피하기 위함).
     새 질문을 추가하려면 index.html의 FAQ 배열과 여기 둘 다 고쳐야 한다.
     ========================================================================= */
  var FAQ = [
    { q: "누설값은 어떻게 입력하나요?", keywords: "입력 저장 측정값 기록 시업전 점검",
      a: "카드를 눌러 해당 채널 화면으로 이동한 뒤, ①시업 전 점검 입력에서 일자·교대·확인자를 채우고 마스터 샘플별 누설값을 입력하고 [저장]을 누르세요." },
    { q: "NG로 뜨면 어떻게 하나요?", keywords: "NG 불량 판정 스펙 이탈",
      a: "입력한 값이 스펙(상한·하한)을 벗어났다는 뜻입니다. 먼저 값을 잘못 입력하지 않았는지 확인하고, 맞다면 재측정해 보세요. 계속 NG가 나오면 관리자에게 알려주세요." },
    { q: "마스터 NG가 반복해서 뜨면 어떻게 하나요?", keywords: "마스터 NG 반복 자주 원인 디텍터 매뉴얼 LS-R700",
      a: "한두 번이면 재측정으로 확인하면 되지만, 계속 반복되면 디텍터(LS-R700) 매뉴얼의 확인 순서를 따라가 보세요. ① 스톱밸브를 닫은 상태에서 No-Leak Test — 디텍터 자체 문제인지 먼저 구분 ② Work(작업물) 쪽 압력 상승 — 씰 마모·오염, Work 내부 공기의 온도 변화 ③ Master(마스터 샘플) 쪽 압력 하강 — 마스터나 배관 조인트의 누설, 배관재 변형, 온도 안정이 나쁜 마스터 ④ 위 방법으로도 해결 안 되면 과잉보정 의심 — 보정값(Comp Value) 갱신이 필요할 수 있습니다. 실제 조치는 설비 보수 담당자에게 문의하세요." },
    { q: "이 화면(전체 현황)은 뭔가요?", keywords: "대시보드 전체현황 요약 카드 화면",
      a: "6개 채널을 QR로 하나씩 찍지 않고 한 화면에서 오늘 상태(정상/NG/미점검)를 요약해서 보여줍니다. 카드를 누르면 그 채널의 상세 입력·그래프 화면으로 이동합니다." },
    { q: "⚠ 추이 이상 배지는 뭔가요?", keywords: "추이 이상 배지 경고 노란상자",
      a: "그 채널의 대표 샘플이 평소 패턴과 통계적으로 다르게 움직이고 있다는 뜻입니다. 스펙 안이어도 표시될 수 있고, 아직 불량은 아니어도 미리 확인해 보라는 신호입니다. 카드를 눌러 들어가면 자세한 원인 힌트를 볼 수 있습니다." },
    { q: "카드에 그래프가 안 보여요", keywords: "그래프 없음 빈 카드 데이터 부족",
      a: "그 채널의 대표 샘플(첫 번째로 등록된 샘플)로 이번 달 기록이 부족하면 그래프 대신 안내 문구가 뜹니다. 카드를 눌러 들어가면 다른 샘플의 기록은 있는지 확인할 수 있습니다." },
    { q: "일부 채널을 불러오지 못했다고 나와요", keywords: "연동 오류 일부 채널 불러오기 실패",
      a: "구글시트 연동이 일시적으로 응답하지 않은 것입니다. 그 채널은 이 폰에 저장된 이전 기록으로 표시됩니다. 잠시 후 새로고침하면 대부분 해결됩니다." },
    { q: "다른 사람이 입력한 값이 안 보여요", keywords: "동기화 연동 안됨 새로고침",
      a: "상단 안내 문구에 연동 관련 메시지가 있는지 확인하고 페이지를 새로고침해 보세요. 구글시트 연동이 꺼져 있으면 이 폰에 저장된 채널만 보입니다." },
    { q: "인터넷이 안 될 때도 볼 수 있나요?", keywords: "오프라인 인터넷 전파 안됨",
      a: "네. 이 폰에 저장된 캐시로 먼저 화면을 그리고, 통신이 되면 자동으로 최신 값으로 갱신합니다." }
  ];

  function searchFaq(query) {
    var q = query.trim().toLowerCase();
    if (!q) return FAQ;
    var tokens = q.split(/[\s,.!?~/·]+/).filter(function (t) { return t.length > 0; });
    if (!tokens.length) return FAQ;
    var scored = FAQ.map(function (f) {
      var hay = (f.q + " " + f.keywords + " " + f.a).toLowerCase();
      var score = 0;
      tokens.forEach(function (t) { if (hay.indexOf(t) >= 0) score++; });
      return { f: f, score: score };
    }).filter(function (x) { return x.score > 0; });
    scored.sort(function (a, b) { return b.score - a.score; });
    return scored.map(function (x) { return x.f; });
  }

  function bigrams(s) {
    var t = String(s || "").replace(/\s+/g, "");
    var out = [];
    for (var i = 0; i < t.length - 1; i++) out.push(t.slice(i, i + 2));
    return out;
  }
  function bigramSimilarity(a, b) {
    var A = bigrams(a), B = bigrams(b);
    if (!A.length || !B.length) return 0;
    var counts = {};
    B.forEach(function (g) { counts[g] = (counts[g] || 0) + 1; });
    var hits = 0;
    A.forEach(function (g) {
      if (counts[g] > 0) { hits++; counts[g]--; }
    });
    return hits / A.length;
  }
  function fuzzySearchFaq(query) {
    var q = query.trim().toLowerCase();
    if (!q) return [];
    var scored = FAQ.map(function (f) {
      var hay = (f.q + " " + f.keywords).toLowerCase();
      return { f: f, score: bigramSimilarity(q, hay) };
    }).filter(function (x) { return x.score >= 0.3; });
    scored.sort(function (a, b) { return b.score - a.score; });
    return scored.slice(0, 4).map(function (x) { return x.f; });
  }

  function renderHelpList(query) {
    var list = $("helpList");
    var results = searchFaq(query || "");
    var isFuzzy = false;

    if (!results.length && query && query.trim()) {
      results = fuzzySearchFaq(query);
      isFuzzy = results.length > 0;
    }

    if (!results.length) {
      list.innerHTML = '<div class="help-empty">일치하는 답을 못 찾았습니다.<br>문의는 후공정 생산기술팀으로 부탁드립니다.</div>';
      return;
    }

    var fuzzyNoteHtml = isFuzzy
      ? '<div class="help-fuzzy-note">정확히 일치하는 답은 못 찾았지만, 혹시 이런 게 궁금하신가요?</div>'
      : "";

    var itemsHtml = results.map(function (f, i) {
      return '<div class="help-item">' +
        '<button type="button" class="help-q" data-i="' + i + '">' +
          '<span>' + esc(f.q) + '</span>' +
          '<span class="chev">▾</span>' +
        '</button>' +
        '<div class="help-a" id="helpA' + i + '" hidden>' + esc(f.a) + '</div>' +
        '</div>';
    }).join("");
    list.innerHTML = fuzzyNoteHtml + itemsHtml;

    results.forEach(function (f, i) {
      var btn = list.querySelector('.help-q[data-i="' + i + '"]');
      var ans = $("helpA" + i);
      btn.addEventListener("click", function () {
        var open = !ans.hidden;
        list.querySelectorAll(".help-a").forEach(function (a) { a.hidden = true; });
        ans.hidden = open;
      });
    });
  }

  function openHelp() {
    $("helpPanel").hidden = false;
    $("helpFab").setAttribute("aria-expanded", "true");
    $("helpFabIcon").textContent = "✕";
    $("helpSearch").value = "";
    renderHelpList("");
    setTimeout(function () { $("helpSearch").focus(); }, 50);
  }

  function closeHelp() {
    $("helpPanel").hidden = true;
    $("helpPanel").classList.remove("kb-avoid");
    $("helpFab").setAttribute("aria-expanded", "false");
    $("helpFabIcon").textContent = "?";
  }

  function initHelp() {
    $("helpFab").addEventListener("click", function () {
      if ($("helpPanel").hidden) openHelp(); else closeHelp();
    });
    $("helpClose").addEventListener("click", closeHelp);
    $("helpSearch").addEventListener("input", function () {
      renderHelpList($("helpSearch").value);
    });

    var isTouch = false;
    try { isTouch = window.matchMedia("(pointer:coarse)").matches; } catch (e) {}
    if (isTouch) {
      $("helpSearch").addEventListener("focus", function () {
        $("helpPanel").classList.add("kb-avoid");
      });
    }

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !$("helpPanel").hidden) closeHelp();
    });
  }

  function boot() {
    var db = loadLocal();
    var sync = window.dnkSync;
    var ym = curYm();

    if (!sync || !sync.enabled()) {
      renderAll(db, "구글시트 연동이 꺼져 있어, 이 폰에 저장된 채널만 보입니다. 다른 폰이 담당하는 채널은 기록이 없는 것처럼 보일 수 있습니다.");
      return;
    }

    renderAll(db); // 우선 로컬 캐시로 즉시 그려서 빈 화면을 보여주지 않는다
    $("dMeta").textContent = "6개 채널 · 불러오는 중…";

    var failed = [];
    Promise.all(EQ_IDS.map(function (id) {
      return sync.pull(id, ym).then(function (data) {
        if (data.samples && data.samples.length) {
          db.eq[id].samples = data.samples.map(function (s) {
            return { id: s.id, name: s.name, type: s.type === "NG" ? "NG" : "OK",
                     nominal: s.nominal, lsl: s.lsl, usl: s.usl };
          });
        }
        db.eq[id].recs = (db.eq[id].recs || []).filter(function (r) { return r.date.slice(0, 7) !== ym; })
          .concat(data.recs || []);
      }, function () {
        failed.push(EQ[id].tab);
      });
    })).then(function () {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); } catch (e) {}
      renderAll(db, failed.length ? ("일부 채널을 불러오지 못했습니다(" + failed.join(", ") + ") — 그 채널은 이 폰의 이전 기록으로 표시됩니다.") : null);
    });
  }

  var ready = (window.dnkGate && window.dnkGate.ready) || Promise.resolve();
  ready.then(boot);
  ready.then(initHelp);
})();
</script>
</body>
